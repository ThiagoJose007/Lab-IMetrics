<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/assets/favicon.png" type="image/png" />
<title>Acesso restrito — Lab-iMetrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0B1120; --surface: #111827; --surface-2: #1a2236;
    --white: #F0F4FF; --body: #A0A8C0; --body-dim: #606880;
    --line: rgba(255,255,255,0.08); --teal: #16A085; --amber: #F39C12;
    --sans: 'DM Sans', sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  html, body { height: 100%; background: var(--ink); color: var(--white); font-family: var(--sans); }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 48px 40px; width: 100%; max-width: 400px;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
  .logo img { height: 32px; }
  .logo span { font-family: var(--mono); font-size: 0.78rem; color: var(--body-dim); letter-spacing: 0.1em; text-transform: uppercase; }
  h1 { font-size: 1.4rem; font-weight: 700; color: var(--white); margin-bottom: 8px; }
  p.sub { font-size: 0.9rem; color: var(--body); margin-bottom: 32px; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .field label { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--body); }
  .field input {
    font-family: var(--sans); font-size: 1rem; color: var(--white);
    background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 13px 16px; transition: border-color .2s;
  }
  .field input:focus { outline: none; border-color: rgba(255,255,255,0.35); }
  .input-wrap { position: relative; }
  .input-wrap input { width: 100%; padding-right: 44px; }
  .btn-eye { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--body-dim); padding: 0; display: flex; align-items: center; transition: color .2s; }
  .btn-eye:hover { color: var(--white); }
  .btn {
    width: 100%; padding: 14px; background: var(--amber); color: #0B1120;
    font-family: var(--sans); font-weight: 700; font-size: 1rem; border-radius: 8px;
    cursor: pointer; transition: opacity .2s; border: none; margin-top: 8px;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    display: none; margin-top: 16px; padding: 12px 16px;
    background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3);
    border-radius: 8px; color: #f87171; font-size: 0.88rem;
  }
  .error.show { display: block; }
  .footer-note { margin-top: 24px; text-align: center; font-family: var(--mono); font-size: 0.72rem; color: var(--body-dim); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="assets/logo.png" alt="Lab-iMetrics" onerror="this.style.display='none'" />
    <span>Lab-iMetrics</span>
  </div>
  <h1>Área restrita</h1>
  <p class="sub">Acesso exclusivo para administradores do laboratório.</p>
  <form id="login-form">
    <div class="field">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password" />
        <button type="button" class="btn-eye" id="btn-eye" aria-label="Mostrar senha">
          <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button class="btn" type="submit" id="btn-login">Entrar</button>
    <div class="error" id="erro">Senha incorreta. Tente novamente.</div>
  </form>
  <p class="footer-note">Esta página não é indexada nem vinculada ao site público.</p>
</div>

<script src="assets/config.js"></script>
<script>
  document.getElementById('btn-eye').addEventListener('click', function () {
    var input = document.getElementById('senha');
    var eyeOn  = document.getElementById('icon-eye');
    var eyeOff = document.getElementById('icon-eye-off');
    var mostrar = input.type === 'password';
    input.type = mostrar ? 'text' : 'password';
    eyeOn.style.display  = mostrar ? 'none' : '';
    eyeOff.style.display = mostrar ? '' : 'none';
  });

  // Se já estiver logado, vai direto para o admin
  if (localStorage.getItem('imetrics_token')) {
    window.location.href = '/admin';
  }

  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('btn-login');
    var erro = document.getElementById('erro');
    var senha = document.getElementById('senha').value;
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    erro.classList.remove('show');

    try {
      var res = await fetch(API_URL + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha: senha })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.erro || 'Erro');
      localStorage.setItem('imetrics_token', data.token);
      window.location.href = '/admin';
    } catch (err) {
      erro.textContent = err.message === 'Failed to fetch'
        ? 'Não foi possível conectar à API. Verifique se ela está rodando.'
        : 'Senha incorreta. Tente novamente.';
      erro.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
