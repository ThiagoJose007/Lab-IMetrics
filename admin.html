<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel Admin — Lab-iMetrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0B1120; --surface: #111827; --surface-2: #1a2236; --surface-3: #222d42;
    --white: #F0F4FF; --body: #A0A8C0; --body-dim: #606880;
    --line: rgba(255,255,255,0.08); --teal: #16A085; --amber: #F39C12;
    --red: #ef4444; --sans: 'DM Sans', sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  html, body { height: 100%; background: var(--ink); color: var(--white); font-family: var(--sans); font-size: 15px; }

  /* ── Top bar ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 60px; gap: 16px;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-left img { height: 28px; }
  .topbar-left .sep { width: 1px; height: 20px; background: var(--line); }
  .topbar-left span { font-family: var(--mono); font-size: 0.75rem; color: var(--body-dim); letter-spacing: 0.08em; }
  .btn-logout { font-family: var(--sans); font-size: 0.85rem; color: var(--body); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; transition: all .2s; }
  .btn-logout:hover { color: var(--white); border-color: rgba(255,255,255,0.3); }

  /* ── Tab nav ── */
  .topbar-nav { display: flex; gap: 4px; }
  .tab-btn { font-family: var(--sans); font-size: 0.85rem; color: var(--body); background: none; border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; transition: all .2s; }
  .tab-btn:hover { color: var(--white); background: rgba(255,255,255,0.06); }
  .tab-btn.active { color: var(--amber); background: rgba(243,156,18,0.1); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Layout ── */
  .main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
  .page-head h1 { font-size: 1.5rem; font-weight: 700; }
  .page-head .stats { font-family: var(--mono); font-size: 0.78rem; color: var(--body-dim); }
  .page-head .stats b { color: var(--amber); }

  /* ── Action bar ── */
  .action-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 200px; font-family: var(--sans); font-size: 0.95rem; color: var(--white);
    background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 10px 16px; transition: border-color .2s;
  }
  .search-input:focus { outline: none; border-color: rgba(255,255,255,0.3); }
  .search-input::placeholder { color: var(--body-dim); }
  .btn-primary {
    font-family: var(--sans); font-weight: 700; font-size: 0.9rem;
    background: var(--amber); color: #0B1120; border: none; border-radius: 8px;
    padding: 10px 20px; cursor: pointer; white-space: nowrap; transition: opacity .2s;
  }
  .btn-primary:hover { opacity: 0.88; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--body-dim); padding: 14px 16px; text-align: left; background: var(--surface); border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--body); font-size: 0.9rem; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }
  .td-title { color: var(--white); font-weight: 500; max-width: 320px; }
  .td-title-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { display: inline-block; font-family: var(--mono); font-size: 0.68rem; padding: 3px 9px; border-radius: 100px; border: 1px solid var(--line); white-space: nowrap; }
  .badge.teal { color: var(--teal); border-color: rgba(26,188,156,0.35); }
  .badge.amber { color: var(--amber); border-color: rgba(243,156,18,0.35); }
  .badge.red { color: var(--red); border-color: rgba(239,68,68,0.35); }
  .actions { display: flex; gap: 8px; }
  .btn-edit, .btn-del {
    font-size: 0.8rem; font-family: var(--sans); padding: 5px 12px; border-radius: 6px; cursor: pointer; transition: all .2s; border: 1px solid;
  }
  .btn-edit { color: var(--teal); border-color: rgba(26,188,156,0.35); background: none; }
  .btn-edit:hover { background: rgba(26,188,156,0.1); }
  .btn-del { color: var(--red); border-color: rgba(239,68,68,0.35); background: none; }
  .btn-del:hover { background: rgba(239,68,68,0.1); }

  /* ── Empty / loading ── */
  .state-box { padding: 60px 24px; text-align: center; color: var(--body-dim); font-size: 0.95rem; }
  .state-box b { display: block; font-size: 1.1rem; color: var(--body); margin-bottom: 8px; }

  /* ── Modal ── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    width: 100%; max-width: 680px; padding: 36px; position: relative;
  }
  .modal h2 { font-size: 1.25rem; margin-bottom: 24px; }
  .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--body-dim); font-size: 1.4rem; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--white); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .span2 { grid-column: span 2; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--body); }
  .field input, .field select, .field textarea {
    font-family: var(--sans); font-size: 0.95rem; color: var(--white);
    background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 11px 14px; transition: border-color .2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: rgba(255,255,255,0.35); }
  .field input::placeholder, .field textarea::placeholder { color: var(--body-dim); }
  .field textarea { resize: vertical; min-height: 90px; line-height: 1.55; }
  .field select option { background: var(--surface-2); }
  .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel { background: none; border: 1px solid var(--line); color: var(--body); border-radius: 8px; padding: 10px 20px; font-family: var(--sans); font-size: 0.9rem; cursor: pointer; transition: all .2s; }
  .btn-cancel:hover { border-color: rgba(255,255,255,0.3); color: var(--white); }
  .btn-save { background: var(--amber); color: #0B1120; border: none; border-radius: 8px; padding: 10px 24px; font-family: var(--sans); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: opacity .2s; }
  .btn-save:hover { opacity: 0.88; }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 300; background: var(--surface-3); border: 1px solid var(--line); border-radius: 8px; padding: 14px 20px; font-size: 0.9rem; opacity: 0; transform: translateY(8px); transition: all .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: rgba(26,188,156,0.4); color: var(--teal); }
  .toast.err { border-color: rgba(239,68,68,0.4); color: #f87171; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .span2 { grid-column: span 1; }
    .topbar { padding: 0 16px; }
    .main { padding: 20px 16px 60px; }
    .topbar-nav { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <img src="assets/logo.png" alt="Lab-iMetrics" onerror="this.style.display='none'" />
    <div class="sep"></div>
    <span>Painel Admin</span>
  </div>
  <nav class="topbar-nav">
    <button class="tab-btn active" data-tab="publicacoes">Publicações</button>
    <button class="tab-btn" data-tab="equipe">Equipe</button>
    <button class="tab-btn" data-tab="imprensa">Imprensa</button>
  </nav>
  <button class="btn-logout" id="btn-logout">Sair</button>
</header>

<main class="main">

  <!-- ── TAB: PUBLICAÇÕES ── -->
  <div id="tab-publicacoes" class="tab-content active">
    <div class="page-head">
      <div>
        <h1>Publicações</h1>
        <p class="stats" id="stats">Carregando…</p>
      </div>
    </div>

    <div class="action-bar">
      <input class="search-input" id="busca" type="search" placeholder="Buscar por título…" />
      <button class="btn-primary" id="btn-nova">+ Nova publicação</button>
    </div>

    <div class="table-wrap">
      <table id="tabela">
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Autores</th>
            <th>Ano</th>
            <th>Tipo</th>
            <th>Linha</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7"><div class="state-box">Carregando…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── TAB: EQUIPE ── -->
  <div id="tab-equipe" class="tab-content">
    <div class="page-head">
      <div>
        <h1>Equipe</h1>
        <p class="stats" id="stats-membro">Carregando…</p>
      </div>
    </div>

    <div class="action-bar">
      <input class="search-input" id="busca-membro" type="search" placeholder="Buscar por nome…" />
      <button class="btn-primary" id="btn-novo-membro">+ Novo membro</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Papel</th>
            <th>Categoria</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-membro">
          <tr><td colspan="6"><div class="state-box">Carregando…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>


  <!-- ── TAB: IMPRENSA ── -->
  <div id="tab-imprensa" class="tab-content">
    <div class="page-head">
      <div>
        <h1>Imprensa</h1>
        <p class="stats" id="stats-imprensa">Carregando…</p>
      </div>
    </div>

    <div class="action-bar">
      <input class="search-input" id="busca-imprensa" type="search" placeholder="Buscar por título…" />
      <button class="btn-primary" id="btn-novo-imprensa">+ Novo item</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Veículo</th>
            <th>Tipo</th>
            <th>Data</th>
            <th>Destaque</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-imprensa">
          <tr><td colspan="8"><div class="state-box">Carregando…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- Modal criar/editar publicação -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">×</button>
    <h2 id="modal-title">Nova publicação</h2>
    <form id="form-pub">
      <div class="form-grid">
        <div class="field span2">
          <label>Título *</label>
          <input type="text" name="titulo" placeholder="Título completo da publicação" required />
        </div>
        <div class="field span2">
          <label>Autores (separados por ponto-e-vírgula)</label>
          <input type="text" name="autores" placeholder="Ronald Ferreira; Maria Silva" />
        </div>
        <div class="field">
          <label>Ano</label>
          <input type="number" name="ano" placeholder="2024" min="1900" max="2100" />
        </div>
        <div class="field">
          <label>Tipo</label>
          <select name="tipo">
            <option value="">— selecione —</option>
            <option value="artigo">Artigo</option>
            <option value="dissertacao">Dissertação</option>
            <option value="tese">Tese</option>
            <option value="congresso">Congresso</option>
            <option value="relatorio">Relatório</option>
          </select>
        </div>
        <div class="field">
          <label>Linha de pesquisa</label>
          <select name="linha">
            <option value="">— selecione —</option>
            <option value="L1">L1 · Cibermetria</option>
            <option value="L2">L2 · Altmetria</option>
            <option value="L3">L3 · Soberania</option>
          </select>
        </div>
        <div class="field">
          <label>Revista / Periódico</label>
          <input type="text" name="revista" placeholder="Nome do periódico" />
        </div>
        <div class="field">
          <label>DOI</label>
          <input type="text" name="doi" placeholder="10.xxxx/exemplo" />
        </div>
        <div class="field">
          <label>Volume</label>
          <input type="text" name="volume" placeholder="28" />
        </div>
        <div class="field">
          <label>Número</label>
          <input type="text" name="numero" placeholder="2" />
        </div>
        <div class="field">
          <label>Páginas</label>
          <input type="text" name="paginas" placeholder="1-18" />
        </div>
        <div class="field">
          <label>Link de acesso</label>
          <input type="url" name="link" placeholder="https://…" />
        </div>
        <div class="field span2">
          <label>Resumo</label>
          <textarea name="resumo" placeholder="Resumo da publicação…"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn-save" id="btn-save">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal criar/editar membro -->
<div class="overlay" id="overlay-membro">
  <div class="modal">
    <button class="modal-close" id="modal-membro-close">×</button>
    <h2 id="modal-membro-title">Novo membro</h2>
    <form id="form-membro">
      <div class="form-grid">
        <div class="field span2">
          <label>Nome completo *</label>
          <input type="text" name="nome" placeholder="Prof. Dr. Ronaldo Ferreira de Araújo" required />
        </div>
        <div class="field">
          <label>Papel / Título</label>
          <input type="text" name="papel" placeholder="Coordenador · Fundador" />
        </div>
        <div class="field">
          <label>Categoria</label>
          <select name="categoria">
            <option value="coordenador">Coordenação</option>
            <option value="doutor" selected>Doutor(a)</option>
            <option value="estudante">Estudante</option>
            <option value="tecnico">Técnico(a)</option>
          </select>
        </div>
        <div class="field span2">
          <label>Área de atuação</label>
          <input type="text" name="area" placeholder="Altmetria · cibermetria · comunicação científica" />
        </div>
        <div class="field">
          <label>Nível (para estudantes)</label>
          <input type="text" name="nivel" placeholder="Doutorado, Mestrado, Graduação" />
        </div>
        <div class="field">
          <label>Status</label>
          <select name="ativo">
            <option value="true" selected>Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
        <div class="field">
          <label>Ordem de exibição</label>
          <input type="number" name="ordem" placeholder="0" min="0" />
        </div>
        <div class="field">
          <label>URL da foto</label>
          <input type="url" name="foto_url" placeholder="https://…/foto.jpg" />
        </div>
        <div class="field">
          <label>Lattes URL</label>
          <input type="url" name="lattes_url" placeholder="http://lattes.cnpq.br/…" />
        </div>
        <div class="field">
          <label>ORCID URL</label>
          <input type="url" name="orcid_url" placeholder="https://orcid.org/…" />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-cancel-membro">Cancelar</button>
        <button type="submit" class="btn-save" id="btn-save-membro">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal criar/editar item de imprensa -->
<div class="overlay" id="overlay-imprensa">
  <div class="modal">
    <button class="modal-close" id="modal-imprensa-close">×</button>
    <h2 id="modal-imprensa-title">Novo item de imprensa</h2>
    <form id="form-imprensa">
      <div class="form-grid">
        <div class="field span2">
          <label>Título *</label>
          <input type="text" name="titulo" placeholder="Título da matéria ou entrevista" required />
        </div>
        <div class="field">
          <label>Veículo / Publicação</label>
          <input type="text" name="veiculo" placeholder="G1, Folha, CNN Brasil…" />
        </div>
        <div class="field">
          <label>Tipo</label>
          <select name="tipo">
            <option value="materia">Matéria</option>
            <option value="entrevista">Entrevista</option>
            <option value="post">Post</option>
            <option value="podcast">Podcast</option>
            <option value="video">Vídeo</option>
          </select>
        </div>
        <div class="field">
          <label>Data de publicação</label>
          <input type="date" name="data_publicacao" />
        </div>
        <div class="field">
          <label>Destaque</label>
          <select name="destaque">
            <option value="false">Não</option>
            <option value="true">Sim</option>
          </select>
        </div>
        <div class="field span2">
          <label>URL do conteúdo</label>
          <input type="url" name="url" placeholder="https://…" />
        </div>
        <div class="field span2">
          <label>URL da imagem (thumbnail)</label>
          <input type="url" name="imagem_url" placeholder="https://…/imagem.jpg" />
        </div>
        <div class="field span2">
          <label>Descrição</label>
          <textarea name="descricao" placeholder="Breve descrição ou trecho da matéria…"></textarea>
        </div>
        <div class="field">
          <label>Status</label>
          <select name="ativo">
            <option value="true" selected>Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-cancel-imprensa">Cancelar</button>
        <button type="submit" class="btn-save" id="btn-save-imprensa">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/config.js"></script>
<script>
  var token = localStorage.getItem('imetrics_token');
  if (!token) window.location.href = '/login';

  var publicacoes = [];
  var editandoId = null;
  var membros = [];
  var editandoMembroId = null;

  // ── Sessão / expiração ──
  function deslogar(motivo) {
    localStorage.removeItem('imetrics_token');
    if (motivo) alert(motivo);
    window.location.href = '/login';
  }

  function verificarToken() {
    if (!token) return deslogar();
    try {
      var payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      var expiresIn = payload.exp * 1000 - Date.now();
      if (expiresIn <= 0) return deslogar('Sua sessão expirou. Faça login novamente.');
      if (expiresIn > 5 * 60 * 1000) {
        setTimeout(function () {
          alert('Sua sessão expira em 5 minutos. Salve o que estiver fazendo.');
        }, expiresIn - 5 * 60 * 1000);
      }
      setTimeout(function () { deslogar('Sessão expirada. Faça login novamente.'); }, expiresIn);
    } catch (e) {
      deslogar('Token inválido. Faça login novamente.');
    }
  }
  verificarToken();

  // ── Auth ──
  document.getElementById('btn-logout').addEventListener('click', function () {
    deslogar();
  });

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  }

  function tratar401() {
    deslogar('Sessão expirada. Faça login novamente.');
  }

  // ── Toast ──
  function toast(msg, tipo) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (tipo || 'ok');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 3000);
  }

  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── Tabs ──
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
      this.classList.add('active');
      document.getElementById('tab-' + this.dataset.tab).classList.add('active');
      if (this.dataset.tab === 'equipe') carregarMembros();
      if (this.dataset.tab === 'imprensa') carregarImprensa();
    });
  });

  // ── Carregar publicações ──
  async function carregar() {
    try {
      var res = await fetch(API_URL + '/api/publicacoes', { headers: authHeaders() });
      if (res.status === 401) { tratar401(); return; }
      var data = await res.json();
      publicacoes = data.dados || [];
      renderTabela(publicacoes);
      document.getElementById('stats').innerHTML = 'Total: <b>' + publicacoes.length + '</b> publicações';
    } catch (e) {
      document.getElementById('tbody').innerHTML = '<tr><td colspan="7"><div class="state-box"><b>Erro de conexão</b>Verifique se a API está rodando em ' + API_URL + '</div></td></tr>';
    }
  }

  // ── Renderizar tabela publicações ──
  function renderTabela(lista) {
    var tbody = document.getElementById('tbody');
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="state-box"><b>Nenhuma publicação encontrada</b>Clique em "+ Nova publicação" para começar.</div></td></tr>';
      return;
    }
    tbody.innerHTML = lista.map(function (p) {
      var autores = Array.isArray(p.autores) ? p.autores.join('; ') : (p.autores || '—');
      var tipo = p.tipo ? p.tipo.charAt(0).toUpperCase() + p.tipo.slice(1) : '—';
      return '<tr>' +
        '<td><span class="badge">' + p.id + '</span></td>' +
        '<td class="td-title"><div class="td-title-text">' + esc(p.titulo) + '</div></td>' +
        '<td>' + esc(autores.length > 40 ? autores.slice(0, 40) + '…' : autores) + '</td>' +
        '<td>' + (p.ano || '—') + '</td>' +
        '<td>' + (p.tipo ? '<span class="badge">' + tipo + '</span>' : '—') + '</td>' +
        '<td>' + (p.linha ? '<span class="badge teal">' + esc(p.linha) + '</span>' : '—') + '</td>' +
        '<td><div class="actions">' +
          '<button class="btn-edit" onclick="abrirEditar(' + p.id + ')">Editar</button>' +
          '<button class="btn-del" onclick="excluir(' + p.id + ', \'' + esc(p.titulo).replace(/'/g, "\\'") + '\')">Excluir</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  // ── Busca publicações ──
  document.getElementById('busca').addEventListener('input', function () {
    var q = this.value.toLowerCase();
    renderTabela(q ? publicacoes.filter(function (p) { return p.titulo.toLowerCase().includes(q); }) : publicacoes);
  });

  // ── Modal publicações ──
  function abrirModal(titulo) {
    editandoId = null;
    document.getElementById('modal-title').textContent = titulo;
    document.getElementById('overlay').classList.add('open');
  }
  function fecharModal() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('form-pub').reset();
    editandoId = null;
  }

  document.getElementById('btn-nova').addEventListener('click', function () { abrirModal('Nova publicação'); });
  document.getElementById('modal-close').addEventListener('click', fecharModal);
  document.getElementById('btn-cancel').addEventListener('click', fecharModal);
  document.getElementById('overlay').addEventListener('click', function (e) { if (e.target === this) fecharModal(); });

  function abrirEditar(id) {
    var p = publicacoes.find(function (x) { return x.id === id; });
    if (!p) return;
    editandoId = id;
    document.getElementById('modal-title').textContent = 'Editar publicação';
    var form = document.getElementById('form-pub');
    form.titulo.value = p.titulo || '';
    form.autores.value = Array.isArray(p.autores) ? p.autores.join('; ') : (p.autores || '');
    form.ano.value = p.ano || '';
    form.tipo.value = p.tipo || '';
    form.linha.value = p.linha || '';
    form.revista.value = p.revista || '';
    form.doi.value = p.doi || '';
    form.volume.value = p.volume || '';
    form.numero.value = p.numero || '';
    form.paginas.value = p.paginas || '';
    form.link.value = p.link || '';
    form.resumo.value = p.resumo || '';
    document.getElementById('overlay').classList.add('open');
  }

  // ── Salvar publicação ──
  document.getElementById('form-pub').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Salvando…';

    var form = e.target;
    var autoresRaw = form.autores.value;
    var body = {
      titulo:   form.titulo.value,
      autores:  autoresRaw ? autoresRaw.split(';').map(function (a) { return a.trim(); }).filter(Boolean) : [],
      ano:      form.ano.value ? parseInt(form.ano.value) : null,
      tipo:     form.tipo.value || null,
      linha:    form.linha.value || null,
      revista:  form.revista.value || null,
      doi:      form.doi.value || null,
      volume:   form.volume.value || null,
      numero:   form.numero.value || null,
      paginas:  form.paginas.value || null,
      link:     form.link.value || null,
      resumo:   form.resumo.value || null,
    };

    try {
      var url = editandoId
        ? API_URL + '/api/admin/publicacoes/' + editandoId
        : API_URL + '/api/admin/publicacoes';
      var res = await fetch(url, {
        method: editandoId ? 'PUT' : 'POST',
        headers: authHeaders(),
        body: JSON.stringify(body)
      });
      if (res.status === 401) { tratar401(); return; }
      if (!res.ok) throw new Error('Erro ao salvar');
      toast(editandoId ? 'Publicação atualizada!' : 'Publicação criada!', 'ok');
      fecharModal();
      carregar();
    } catch (err) {
      toast('Erro ao salvar. Tente novamente.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Salvar';
    }
  });

  // ── Excluir publicação ──
  async function excluir(id, titulo) {
    if (!confirm('Excluir "' + titulo + '"?\nEsta ação não pode ser desfeita.')) return;
    try {
      var res = await fetch(API_URL + '/api/admin/publicacoes/' + id, {
        method: 'DELETE', headers: authHeaders()
      });
      if (res.status === 401) { tratar401(); return; }
      if (!res.ok) throw new Error();
      toast('Publicação removida.', 'ok');
      carregar();
    } catch {
      toast('Erro ao excluir.', 'err');
    }
  }

  // ── Carregar membros ──
  async function carregarMembros() {
    try {
      var res = await fetch(API_URL + '/api/admin/membros', { headers: authHeaders() });
      if (res.status === 401) { tratar401(); return; }
      membros = await res.json();
      renderTabelaMembros(membros);
      document.getElementById('stats-membro').innerHTML = 'Total: <b>' + membros.length + '</b> membros';
    } catch (e) {
      document.getElementById('tbody-membro').innerHTML = '<tr><td colspan="6"><div class="state-box"><b>Erro de conexão</b>Verifique se a API está rodando em ' + API_URL + '</div></td></tr>';
    }
  }

  // ── Renderizar tabela membros ──
  var catLabel = { coordenador: 'Coordenação', doutor: 'Doutor', estudante: 'Estudante', tecnico: 'Técnico' };

  function renderTabelaMembros(lista) {
    var tbody = document.getElementById('tbody-membro');
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="state-box"><b>Nenhum membro encontrado</b>Clique em "+ Novo membro" para começar.</div></td></tr>';
      return;
    }
    tbody.innerHTML = lista.map(function (m) {
      var cat = catLabel[m.categoria] || m.categoria;
      var catClass = m.categoria === 'coordenador' ? ' amber' : m.categoria === 'doutor' ? ' teal' : '';
      var ativo = m.ativo ? '<span class="badge teal">Ativo</span>' : '<span class="badge red">Inativo</span>';
      return '<tr>' +
        '<td><span class="badge">' + m.id + '</span></td>' +
        '<td class="td-title"><div class="td-title-text">' + esc(m.nome) + '</div></td>' +
        '<td>' + esc(m.papel || '—') + '</td>' +
        '<td><span class="badge' + catClass + '">' + esc(cat) + '</span></td>' +
        '<td>' + ativo + '</td>' +
        '<td><div class="actions">' +
          '<button class="btn-edit" onclick="abrirEditarMembro(' + m.id + ')">Editar</button>' +
          '<button class="btn-del" onclick="excluirMembro(' + m.id + ', \'' + esc(m.nome).replace(/'/g, "\\'") + '\')">Excluir</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  // ── Busca membros ──
  document.getElementById('busca-membro').addEventListener('input', function () {
    var q = this.value.toLowerCase();
    renderTabelaMembros(q ? membros.filter(function (m) { return m.nome.toLowerCase().includes(q); }) : membros);
  });

  // ── Modal membros ──
  function fecharModalMembro() {
    document.getElementById('overlay-membro').classList.remove('open');
    document.getElementById('form-membro').reset();
    editandoMembroId = null;
  }

  document.getElementById('btn-novo-membro').addEventListener('click', function () {
    editandoMembroId = null;
    document.getElementById('modal-membro-title').textContent = 'Novo membro';
    document.getElementById('overlay-membro').classList.add('open');
  });
  document.getElementById('modal-membro-close').addEventListener('click', fecharModalMembro);
  document.getElementById('btn-cancel-membro').addEventListener('click', fecharModalMembro);
  document.getElementById('overlay-membro').addEventListener('click', function (e) { if (e.target === this) fecharModalMembro(); });

  function abrirEditarMembro(id) {
    var m = membros.find(function (x) { return x.id === id; });
    if (!m) return;
    editandoMembroId = id;
    document.getElementById('modal-membro-title').textContent = 'Editar membro';
    var form = document.getElementById('form-membro');
    form.nome.value = m.nome || '';
    form.papel.value = m.papel || '';
    form.area.value = m.area || '';
    form.categoria.value = m.categoria || 'doutor';
    form.nivel.value = m.nivel || '';
    form.foto_url.value = m.foto_url || '';
    form.lattes_url.value = m.lattes_url || '';
    form.orcid_url.value = m.orcid_url || '';
    form.ativo.value = m.ativo ? 'true' : 'false';
    form.ordem.value = m.ordem || 0;
    document.getElementById('overlay-membro').classList.add('open');
  }

  // ── Salvar membro ──
  document.getElementById('form-membro').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('btn-save-membro');
    btn.disabled = true;
    btn.textContent = 'Salvando…';

    var form = e.target;
    var body = {
      nome:       form.nome.value,
      papel:      form.papel.value || null,
      area:       form.area.value || null,
      categoria:  form.categoria.value || 'doutor',
      nivel:      form.nivel.value || null,
      foto_url:   form.foto_url.value || null,
      lattes_url: form.lattes_url.value || null,
      orcid_url:  form.orcid_url.value || null,
      ativo:      form.ativo.value === 'true',
      ordem:      form.ordem.value ? parseInt(form.ordem.value) : 0,
    };

    try {
      var url = editandoMembroId
        ? API_URL + '/api/admin/membros/' + editandoMembroId
        : API_URL + '/api/admin/membros';
      var res = await fetch(url, {
        method: editandoMembroId ? 'PUT' : 'POST',
        headers: authHeaders(),
        body: JSON.stringify(body)
      });
      if (res.status === 401) { tratar401(); return; }
      if (!res.ok) throw new Error('Erro ao salvar');
      toast(editandoMembroId ? 'Membro atualizado!' : 'Membro criado!', 'ok');
      fecharModalMembro();
      carregarMembros();
    } catch (err) {
      toast('Erro ao salvar. Tente novamente.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Salvar';
    }
  });

  // ── Excluir membro ──
  async function excluirMembro(id, nome) {
    if (!confirm('Excluir "' + nome + '"?\nEsta ação não pode ser desfeita.')) return;
    try {
      var res = await fetch(API_URL + '/api/admin/membros/' + id, {
        method: 'DELETE', headers: authHeaders()
      });
      if (res.status === 401) { tratar401(); return; }
      if (!res.ok) throw new Error();
      toast('Membro removido.', 'ok');
      carregarMembros();
    } catch {
      toast('Erro ao excluir.', 'err');
    }
  }

  // ── Imprensa: dados ──
  var itensImprensa = [];
  var editandoImprensaId = null;

  var tipoLabel = { materia: 'Matéria', entrevista: 'Entrevista', post: 'Post', podcast: 'Podcast', video: 'Vídeo' };

  // ── Carregar imprensa ──
  async function carregarImprensa() {
    try {
      var res = await fetch(API_URL + '/api/admin/imprensa', { headers: authHeaders() });
      if (res.status === 401) { tratar401(); return; }
      itensImprensa = await res.json();
      renderTabelaImprensa(itensImprensa);
      document.getElementById('stats-imprensa').innerHTML = 'Total: <b>' + itensImprensa.length + '</b> itens';
    } catch (e) {
      document.getElementById('tbody-imprensa').innerHTML = '<tr><td colspan="8"><div class="state-box"><b>Erro de conexão</b>Verifique se a API está rodando.</div></td></tr>';
    }
  }

  function renderTabelaImprensa(lista) {
    var tbody = document.getElementById('tbody-imprensa');
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="state-box"><b>Nenhum item encontrado</b>Clique em "+ Novo item" para começar.</div></td></tr>';
      return;
    }
    tbody.innerHTML = lista.map(function (it) {
      var tipo = tipoLabel[it.tipo] || it.tipo;
      var data = it.data_publicacao ? new Date(it.data_publicacao).toLocaleDateString('pt-BR', { timeZone: 'UTC' }) : '—';
      var destaque = it.destaque ? '<span class="badge amber">Sim</span>' : '<span class="badge">Não</span>';
      var status = it.ativo ? '<span class="badge teal">Ativo</span>' : '<span class="badge red">Inativo</span>';
      return '<tr>' +
        '<td><span class="badge">' + it.id + '</span></td>' +
        '<td class="td-title"><div class="td-title-text">' + esc(it.titulo) + '</div></td>' +
        '<td>' + esc(it.veiculo || '—') + '</td>' +
        '<td><span class="badge">' + esc(tipo) + '</span></td>' +
        '<td>' + data + '</td>' +
        '<td>' + destaque + '</td>' +
        '<td>' + status + '</td>' +
        '<td><div class="actions">' +
          '<button class="btn-edit" onclick="abrirEditarImprensa(' + it.id + ')">Editar</button>' +
          '<button class="btn-del" onclick="excluirImprensa(' + it.id + ', \'' + esc(it.titulo).replace(/'/g, "\\'") + '\')">Excluir</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  document.getElementById('busca-imprensa').addEventListener('input', function () {
    var q = this.value.toLowerCase();
    renderTabelaImprensa(q ? itensImprensa.filter(function (it) { return it.titulo.toLowerCase().includes(q); }) : itensImprensa);
  });

  // ── Modal imprensa ──
  function fecharModalImprensa() {
    document.getElementById('overlay-imprensa').classList.remove('open');
    document.getElementById('form-imprensa').reset();
    editandoImprensaId = null;
  }

  document.getElementById('btn-novo-imprensa').addEventListener('click', function () {
    editandoImprensaId = null;
    document.getElementById('modal-imprensa-title').textContent = 'Novo item de imprensa';
    document.getElementById('overlay-imprensa').classList.add('open');
  });
  document.getElementById('modal-imprensa-close').addEventListener('click', fecharModalImprensa);
  document.getElementById('btn-cancel-imprensa').addEventListener('click', fecharModalImprensa);
  document.getElementById('overlay-imprensa').addEventListener('click', function (e) { if (e.target === this) fecharModalImprensa(); });

  function abrirEditarImprensa(id) {
    var it = itensImprensa.find(function (x) { return x.id === id; });
    if (!it) return;
    editandoImprensaId = id;
    document.getElementById('modal-imprensa-title').textContent = 'Editar item de imprensa';
    var form = document.getElementById('form-imprensa');
    form.titulo.value = it.titulo || '';
    form.veiculo.value = it.veiculo || '';
    form.tipo.value = it.tipo || 'materia';
    form.data_publicacao.value = it.data_publicacao ? it.data_publicacao.slice(0, 10) : '';
    form.url.value = it.url || '';
    form.imagem_url.value = it.imagem_url || '';
    form.descricao.value = it.descricao || '';
    form.destaque.value = it.destaque ? 'true' : 'false';
    form.ativo.value = it.ativo ? 'true' : 'false';
    document.getElementById('overlay-imprensa').classList.add('open');
  }

  document.getElementById('form-imprensa').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('btn-save-imprensa');
    btn.disabled = true; btn.textContent = 'Salvando…';
    var form = e.target;
    var body = {
      titulo:          form.titulo.value,
      veiculo:         form.veiculo.value || null,
      tipo:            form.tipo.value || 'materia',
      data_publicacao: form.data_publicacao.value || null,
      url:             form.url.value || null,
      imagem_url:      form.imagem_url.value || null,
      descricao:       form.descricao.value || null,
      destaque:        form.destaque.value === 'true',
      ativo:           form.ativo.value === 'true',
    };
    try {
      var url = editandoImprensaId
        ? API_URL + '/api/admin/imprensa/' + editandoImprensaId
        : API_URL + '/api/admin/imprensa';
      var res = await fetch(url, { method: editandoImprensaId ? 'PUT' : 'POST', headers: authHeaders(), body: JSON.stringify(body) });
      if (res.status === 401) { tratar401(); return; }
      if (!res.ok) throw new Error();
      toast(editandoImprensaId ? 'Item atualizado!' : 'Item criado!', 'ok');
      fecharModalImprensa();
      carregarImprensa();
    } catch { toast('Erro ao salvar. Tente novamente.', 'err'); }
    finally { btn.disabled = false; btn.textContent = 'Salvar'; }
  });

  async function excluirImprensa(id, titulo) {
    if (!confirm('Excluir "' + titulo + '"?\nEsta ação não pode ser desfeita.')) return;
    try {
      var res = await fetch(API_URL + '/api/admin/imprensa/' + id, { method: 'DELETE', headers: authHeaders() });
      if (res.status === 401) { tratar401(); return; }
      if (!res.ok) throw new Error();
      toast('Item removido.', 'ok');
      carregarImprensa();
    } catch { toast('Erro ao excluir.', 'err'); }
  }

  carregar();
</script>
</body>
</html>
