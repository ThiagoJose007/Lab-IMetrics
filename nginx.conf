server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /login {
        try_files /login.html =404;
    }

    location = /login.html {
        return 301 /login;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = /admin.html {
        return 301 /admin;
    }

    location = /imprensa-detalhe {
        try_files /imprensa-detalhe.html =404;
    }

    location = /imprensa-detalhe.html {
        return 301 /imprensa-detalhe;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML nunca fica em cache — garante que o browser sempre pega a versão nova
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # config.js: nunca cachear (contém API_URL injetada em runtime)
    location = /assets/config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS e JS do projeto: revalida a cada acesso (ETag resolve sem re-download se não mudou)
    location ~* ^/assets/.*\.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        etag on;
    }

    # Imagens e fontes: cache longo (mudam raramente)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
